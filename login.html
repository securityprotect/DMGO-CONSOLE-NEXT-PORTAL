<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>DMGO Console — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" type="text/css" href="vendors/styles/core.css" />
  <link rel="stylesheet" type="text/css" href="vendors/styles/icon-font.min.css" />
  <link rel="stylesheet" type="text/css" href="vendors/styles/style.css" />
  <style>
    body { background: #f4f6fb; }
    .dmgo-login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .dmgo-login-card { width: 100%; max-width: 420px; background: #fff; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.08); padding: 38px 34px; }
    .dmgo-brand { font-weight: 800; font-size: 22px; color: #1b2a4e; margin-bottom: 4px; }
    .dmgo-sub { color: #888; font-size: 13px; margin-bottom: 26px; }
    .form-group label { font-weight: 600; font-size: 13px; color: #444; }
    .alert-dmgo { display:none; margin-top: 14px; }
  </style>
</head>
<body>
  <div class="dmgo-login-wrap">
    <div class="dmgo-login-card">
      <div class="dmgo-brand">DMGO Console</div>
      <div class="dmgo-sub">Admin sign-in — manage everything from here.</div>

      <form id="login-form" autocomplete="on">
        <div class="form-group mb-3">
          <label for="email">Email</label>
          <input type="email" class="form-control" id="email" placeholder="you@dmgo.in" required />
        </div>
        <div class="form-group mb-3">
          <label for="password">Password</label>
          <input type="password" class="form-control" id="password" placeholder="••••••••" required />
        </div>
        <div class="form-group mb-3" id="mfa-group" style="display:none;">
          <label for="mfa">MFA code</label>
          <input type="text" class="form-control" id="mfa" placeholder="123456" inputmode="numeric" />
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-block" id="submit-btn">Sign in</button>
        <div class="alert alert-danger alert-dmgo" id="error-box"></div>
      </form>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    (function () {
      var form = document.getElementById('login-form');
      var btn = document.getElementById('submit-btn');
      var errBox = document.getElementById('error-box');
      var mfaGroup = document.getElementById('mfa-group');

      function showError(msg) { errBox.textContent = msg; errBox.style.display = 'block'; }

      // If already authenticated, skip login.
      if (!window.DMGO_AUTH.isPreview()) {
        window.DMGO_API.get('/admin/session', { skipRenewal: true }).then(function (s) {
          if (s && s.authenticated) window.location.href = 'console.html';
        }).catch(function () {});
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        errBox.style.display = 'none';
        var email = document.getElementById('email').value.trim();
        var password = document.getElementById('password').value;
        var mfa = document.getElementById('mfa').value.trim();
        btn.disabled = true; btn.textContent = 'Signing in…';

        window.DMGO_AUTH.login(email, password, mfa).then(function (res) {
          if (res && res.mfaEnabled && !mfa) {
            mfaGroup.style.display = 'block';
            btn.disabled = false; btn.textContent = 'Sign in';
            showError('MFA code required.');
            return;
          }
          window.location.href = 'console.html';
        }).catch(function (err) {
          btn.disabled = false; btn.textContent = 'Sign in';
          showError((err && err.message) || 'Login failed.');
        });
      });
    })();
  </script>
</body>
</html>
